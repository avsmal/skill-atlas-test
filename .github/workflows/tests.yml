name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the tests when every changed file is Markdown outside tests/ (docs, spec, memory).
  # Markdown under tests/ is fixture data (SKILL.md files) and still triggers them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$(git merge-base "$PR_BASE" HEAD) ;;
            push) base=$PUSH_BEFORE ;;
            *) base= ;;
          esac
          # Manual runs, new branches and unknown bases: run the tests.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$base" HEAD | tee changed.txt
          if grep -Ev '\.md$' changed.txt | grep -q . || grep -q '^tests/' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: case-insensitive filesystem, BSD userland
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Check fixture repo survived checkout (symlinks, CRLF)
        run: |
          test -L tests/fixtures/edge-repo/.claude/skills/linked/SKILL.md
          test -L tests/fixtures/edge-repo/mirror/.claude/skills
          grep -q $'\r' tests/fixtures/edge-repo/.claude/skills/crlf/SKILL.md

      - name: Test
        run: python -m pytest -v

  # Re-record docs/demo.mp4 and compare screenshots at its key moments with tests/demo_frames/.
  # Once per pull request run (not per OS, not on pushes to main). See spec/demo-video.md.
  demo-video:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    # Pinned image: fonts and system libraries change how the pages render.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          python -m pip install -e '.[demo]'
          python -m playwright install --with-deps chromium

      - name: Pin the demo repositories to the video's commits
        id: pin
        run: |
          scripts/demo/pin-repos.sh "$RUNNER_TEMP/pins"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/pins/gitconfig" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/demo" >> "$GITHUB_ENV"

      - name: Check the baseline screenshots come from docs/demo.mp4
        run: |
          python scripts/demo/video.py extract docs/demo.mp4 docs/demo-moments.json "$OUT/baseline-frames"
          python scripts/demo/video.py compare tests/demo_frames "$OUT/baseline-frames" "$OUT/baseline-diff" \
            --title "Baseline screenshots vs docs/demo.mp4"

      # Record even when the baseline check failed, so the artifact can become the new baseline.
      - name: Record the demo video
        id: record
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        run: |
          python .claude/skills/record-demo/scripts/demo_30s.py "$OUT"
          python scripts/demo/video.py extract "$OUT/demo.mp4" "$OUT/demo-moments.json" "$OUT/frames"

      - name: Compare screenshots with tests/demo_frames
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        run: python scripts/demo/video.py compare tests/demo_frames "$OUT/frames" "$OUT/diff"

      # To accept the new recording: scripts/demo/update-baseline.sh <run id>
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: |
            ${{ runner.temp }}/demo/demo.mp4
            ${{ runner.temp }}/demo/demo.gif
            ${{ runner.temp }}/demo/sheet.png
            ${{ runner.temp }}/demo/demo-moments.json
            ${{ runner.temp }}/demo/frames/
            ${{ runner.temp }}/demo/diff/
            ${{ runner.temp }}/demo/baseline-diff/
          if-no-files-found: warn
