[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-atlas"
version = "0.1.0"
description = "List agent skills (SKILL.md) in a GitHub repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]
# Recording the demo video (.claude/skills/record-demo, spec/demo-video.md). Playwright is pinned:
# a new Chromium renders differently and would change the screenshots.
demo = ["playwright==1.63.0", "pillow>=10"]

[project.scripts]
skill-atlas = "skill_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
